[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carve"
version = "0.1.0"
description = "Isaac Sim project for vision-guided robotic protein handling"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
