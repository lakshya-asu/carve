name: Publish the pork leg cell plan

# Serves https://lakshya-asu.github.io/carve/ from docs/, built by tools/build_pages.py.
# This replaced the CARVE technical report on 2026-09-15; the report's sources and its original
# workflow remain on the archive/main-2026-09-15 branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          cp -R docs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
