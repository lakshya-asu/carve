# UR20 executor, driving the generated description (cell_description/urdf/ur20_cell.urdf) through
# MoveIt's move_group for IK. Motion limits and pick window are assumptions, not measured.
grasp_executor:
  ros__parameters:
    use_sim_time: true
    arm_id: ur20
    planning_group: ur_manipulator
    tip_link: tcp
    ik_service: compute_ik
    joint_names: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    tool_tilts: true
    max_tool_speed_mps: 1.0          # assumed
    max_tool_acceleration_mps2: 2.0  # assumed
    command_latency_s: 0.05          # assumed until measured on the controller
    pick_window_m: [-0.4, 0.6, 0.15, 0.85]
    descend_s: 0.4
    trajectory_action: ur20_arm_controller/follow_joint_trajectory
    gripper_action: gripper_controller/gripper_cmd
