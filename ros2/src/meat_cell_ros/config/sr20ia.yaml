# FANUC SR-20iA executor (cell_description/urdf/sr20ia_cell.urdf). IK comes from scara_ik_node,
# closed form, because a four-joint arm cannot meet MoveIt KDL's six-number pose goals. tool_tilts is
# false: every joint axis is vertical, so a tilted grasp is refused before motion.
grasp_executor:
  ros__parameters:
    use_sim_time: true
    arm_id: sr20ia
    planning_group: scara
    tip_link: tcp
    ik_service: scara/compute_ik
    joint_names: [j1, j2, j3, j4]
    tool_tilts: false
    max_tool_speed_mps: 1.0          # assumed
    max_tool_acceleration_mps2: 2.0  # assumed
    command_latency_s: 0.05          # assumed
    pick_window_m: [-0.4, 0.6, 0.15, 0.85]
    descend_s: 0.4
    trajectory_action: sr20ia_arm_controller/follow_joint_trajectory
    gripper_action: gripper_controller/gripper_cmd
